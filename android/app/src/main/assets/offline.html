<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Games</title>
  <!--
    Shown only if the app can't reach the games website AND hasn't saved
    a copy yet (normally just the very first time, with no internet).
    After one successful visit, the games work offline.
  -->
  <style>
    :root { --bg: #eef3ee; --fg: #1f2a24; --muted: #5d6b63; --accent: #2f7d4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141a16; --fg: #eef3ee; --muted: #a3b1a8; --accent: #5cb882; }
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-inline: 24px;
      text-align: center;
    }
    main { max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
    h1 { margin: 0; font: 400 2rem Georgia, "Times New Roman", serif; color: var(--accent); }
    p { margin: 0; font-size: 1.15rem; color: var(--muted); }
    button {
      min-height: 60px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: 700 1.3rem "Segoe UI", Roboto, Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Almost ready</h1>
    <p>The games need the internet one time to finish setting up. Please connect to Wi-Fi or turn on mobile data.</p>
    <p>After that, they work even without internet.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // The app passes the games address after "?retry=".
    var address = decodeURIComponent((location.search.split("retry=")[1] || ""));
    document.getElementById("retry").onclick = function () {
      if (address) location.replace(address);
    };
  </script>
</body>
</html>
